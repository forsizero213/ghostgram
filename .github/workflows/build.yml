name: Build Telegram for KSign

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          set -euo pipefail

          XCODE_VERSION=$(python3 -c '
          import json
          with open("versions.json") as f:
              print(json.load(f)["xcode"])
          ')

          echo "Using Xcode $XCODE_VERSION"

          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

          xcodebuild -version

      - name: Cache Bazel Build Directory
        uses: actions/cache@v4
        with:
          path: /private/var/tmp/_bazel_containerhost
          key: bazel-cache-${{ runner.os }}-${{ hashFiles('**/BUILD', '**/BUILD.bazel', 'WORKSPACE', 'versions.json') }}
          restore-keys: |
            bazel-cache-${{ runner.os }}-

      - name: Cache Bazel Binary
        uses: actions/cache@v4
        with:
          path: /tmp/bazel-bin-cache
          key: bazel-binary-${{ runner.os }}-${{ hashFiles('versions.json') }}

      - name: Create canonical source directory
        run: |
          set -euo pipefail

          sudo mkdir -p /Users/Shared

          rm -rf /Users/Shared/telegram-ios

          cp -R "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios

      - name: Setup Minimal Configuration
        run: |
          set -euo pipefail

          cd /Users/Shared/telegram-ios

          cat << 'EOF' > build-system/appstore-configuration.json
          {
            "bundle_id": "ph.telegra.Telegraph",
            "api_id": "34064276",
            "api_hash": "79d1eeba6d4521f29a81dc40db4ec79a",
            "team_id": "C67CF9S4VU",
            "app_center_id": "0",
            "is_internal_build": "false",
            "is_appstore_build": "true",
            "appstore_id": "0",
            "app_specific_url_scheme": "tg",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF
      - name: Pre-download Bazel Binary with Retry
        run: |
          set -euo pipefail
          BAZEL_VERSION="8.4.2"
          BAZEL_DIR="/tmp/bazel-bin-cache"
          mkdir -p "$BAZEL_DIR"

          if [ ! -f "$BAZEL_DIR/bazel" ]; then
            echo "Downloading Bazel $BAZEL_VERSION..."
            curl --retry 10 \
                 --retry-delay 5 \
                 --retry-max-time 120 \
                 --connect-timeout 15 \
                 -sSL "https://github.com/bazelbuild/bazel/releases/download/${BAZEL_VERSION}/bazel-${BAZEL_VERSION}-darwin-arm64" \
                 -o "$BAZEL_DIR/bazel"
            chmod +x "$BAZEL_DIR/bazel"
          fi

          echo "BAZEL_BIN=$BAZEL_DIR/bazel" >> "$GITHUB_ENV"
 
      - name: Prepare unsigned build
        run: |
          set -euo pipefail

          cd /Users/Shared/telegram-ios

          rm -rf build-input

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          APP_VERSION=$(python3 -c '
          import json
          with open("versions.json") as f:
              print(json.load(f)["app"])
          ')

          COMMIT_COUNT="$(git rev-list --count HEAD)"
          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          echo "APP_VERSION=$APP_VERSION"
          echo "BUILD_NUMBER=$BUILD_NUMBER"

      - name: Build unsigned IPA
        run: |
          set -euo pipefail

          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd "$SOURCE_DIR"

          # Added --xcodeManagedCodesigning to satisfy Make.py validation
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --bazel="$BAZEL_BIN" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --xcodeManagedCodesigning \
            --bazelArg=--//Telegram:disableProvisioningProfiles

          OUTPUT_PATH="build/artifacts"

          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          IPA_PATH=""

          if [ -f "bazel-bin/Telegram/Telegram.ipa" ]; then
            IPA_PATH="bazel-bin/Telegram/Telegram.ipa"
          else
            IPA_PATH=$(find bazel-out \
              -path '*/bin/Telegram/Telegram.ipa' \
              -type f \
              -print -quit || true)
          fi

          if [ -z "$IPA_PATH" ] || [ ! -f "$IPA_PATH" ]; then
            echo "ERROR: Telegram.ipa was not produced."
            exit 1
          fi

          echo "Found IPA: $IPA_PATH"

          cp "$IPA_PATH" "$OUTPUT_PATH/Telegram.ipa"

          echo "IPA:"
          ls -lh "$OUTPUT_PATH/Telegram.ipa"

      - name: Strip signing and provisioning data
        run: |
          set -euo pipefail

          cd /Users/Shared/telegram-ios

          IPA="$PWD/build/artifacts/Telegram.ipa"
          TEMP_DIR="$(mktemp -d)"
          OUTPUT_DIR="$PWD/build/artifacts"

          trap 'rm -rf "$TEMP_DIR"' EXIT

          echo "Extracting IPA..."
          unzip -q "$IPA" -d "$TEMP_DIR"

          echo "Removing provisioning profiles..."

          find "$TEMP_DIR/Payload" \
            -type f \
            -name "embedded.mobileprovision" \
            -delete

          echo "Removing code signatures..."

          find "$TEMP_DIR/Payload" \
            -type d \
            -name "_CodeSignature" \
            -prune \
            -exec rm -rf {} +

          # Remove any legacy CodeResources files if present.
          find "$TEMP_DIR/Payload" \
            -type f \
            -name "CodeResources" \
            -delete

          rm -f "$IPA"

          cd "$TEMP_DIR"

          zip -qry \
            "$OUTPUT_DIR/Telegram.ipa" \
            Payload

          echo
          echo "Final unsigned IPA:"
          ls -lh "$OUTPUT_DIR/Telegram.ipa"

          echo
          echo "Checking for provisioning profiles..."

          if unzip -l "$OUTPUT_DIR/Telegram.ipa" \
              | grep -q "embedded.mobileprovision"; then
            echo "::error::embedded.mobileprovision is still present!"
            exit 1
          fi

          echo "No provisioning profiles found."

          echo
          echo "Checking for code signatures..."

          if unzip -l "$OUTPUT_DIR/Telegram.ipa" \
              | grep -q "_CodeSignature/"; then
            echo "::error::_CodeSignature is still present!"
            exit 1
          fi

          echo "No _CodeSignature directories found."
          echo
          echo "IPA is ready for KSign."

      - name: Collect DSYMs
        run: |
          set -euo pipefail

          cd /Users/Shared/telegram-ios

          OUTPUT_PATH="build/artifacts"
          mkdir -p build/DSYMs

          if [ -d "bazel-bin/Telegram/Telegram.app.dSYM" ]; then
            cp -R bazel-bin/Telegram/*.dSYM \
              build/DSYMs/ 2>/dev/null || true
          else
            find bazel-out \
              -path '*/bin/Telegram/*.dSYM' \
              -type d \
              -exec cp -R {} build/DSYMs/ \; 2>/dev/null || true
          fi

          rm -f "$OUTPUT_PATH/Telegram.DSYMs.zip"

          cd build

          zip -qr \
            "../$OUTPUT_PATH/Telegram.DSYMs.zip" \
            DSYMs

          cd ..

          echo "DSYM archive:"
          ls -lh "$OUTPUT_PATH/Telegram.DSYMs.zip"

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: Telegram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }}) - KSign Ready
          body: |
            Unsigned Telegram iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }}).

            This IPA contains:
            - No provisioning profiles
            - No _CodeSignature directories
            - arm64 device binaries
            - DSYMs

            The IPA is intended to be signed separately with KSign.
          draft: false
          prerelease: false
          files: |
            /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
