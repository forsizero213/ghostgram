name: Build Telegram for KSign

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          set -euo pipefail
          XCODE_VERSION=$(python3 -c '
          import json
          with open("versions.json") as f:
              print(json.load(f)["xcode"])
          ')
          echo "Using Xcode $XCODE_VERSION"
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      - name: Cache Bazel Build Directory
        uses: actions/cache@v4
        with:
          path: /private/var/tmp/_bazel_containerhost
          key: bazel-cache-${{ runner.os }}-${{ hashFiles('**/BUILD', '**/BUILD.bazel', 'WORKSPACE', 'WORKSPACE.bazel', 'MODULE.bazel', 'MODULE.bazel.lock', 'versions.json') }}
          restore-keys: |
            bazel-cache-${{ runner.os }}-

      - name: Cache Bazel Binary
        uses: actions/cache@v4
        with:
          path: /tmp/bazel-bin-cache
          key: bazel-binary-${{ runner.os }}-${{ hashFiles('versions.json') }}

      - name: Create canonical source directory
        run: |
          set -euo pipefail
          sudo mkdir -p /Users/Shared
          rm -rf /Users/Shared/telegram-ios
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios

      - name: Setup Minimal Configuration
        run: |
          set -euo pipefail
          cd /Users/Shared/telegram-ios
          cat << 'EOF' > build-system/appstore-configuration.json
          {
            "bundle_id": "ph.telegra.Telegraph",
            "api_id": "34064276",
            "api_hash": "79d1eeba6d4521f29a81dc40db4ec79a",
            "team_id": "C67CF9S4VU",
            "app_center_id": "0",
            "is_internal_build": "false",
            "is_appstore_build": "true",
            "appstore_id": "0",
            "app_specific_url_scheme": "tg",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF

      - name: Verify profiles have fake cert (sanity check)
        run: |
          set -euo pipefail
          cd /Users/Shared/telegram-ios
          PUB="build-system/fake-codesigning/certs/Public.cer"
          PUB_SHA="$(shasum -a 256 "$PUB" | awk '{print $1}')"
          echo "Public.cer sha256 = $PUB_SHA"
          FAIL=0
          for f in build-system/fake-codesigning/profiles/*.mobileprovision; do
            DECODED="$(security cms -D -i "$f" 2>/dev/null || true)"
            COUNT=$(printf '%s' "$DECODED" | grep -c '<key>DeveloperCertificates</key>' || true)
            echo "$f  DeveloperCertificates=$COUNT"
            if [ "$COUNT" -lt 1 ]; then
              echo "::error::$f missing DeveloperCertificates"
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then exit 1; fi

      - name: Pre-download Bazel Binary with Retry
        run: |
          set -euo pipefail
          BAZEL_VERSION="8.4.2"
          BAZEL_DIR="/tmp/bazel-bin-cache"
          mkdir -p "$BAZEL_DIR"
          if [ ! -f "$BAZEL_DIR/bazel" ]; then
            echo "Downloading Bazel $BAZEL_VERSION..."
            curl --retry 10 --retry-delay 5 --retry-max-time 120 --connect-timeout 15 \
              -sSL "https://github.com/bazelbuild/bazel/releases/download/${BAZEL_VERSION}/bazel-${BAZEL_VERSION}-darwin-arm64" \
              -o "$BAZEL_DIR/bazel"
            chmod +x "$BAZEL_DIR/bazel"
          fi
          echo "BAZEL_BIN=$BAZEL_DIR/bazel" >> "$GITHUB_ENV"

      - name: Prepare unsigned build
        run: |
          set -euo pipefail
          cd /Users/Shared/telegram-ios

          rm -rf build-input

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          APP_VERSION=$(python3 -c '
          import json
          with open("versions.json") as f:
              print(json.load(f)["app"])
          ')

          COMMIT_COUNT="$(git rev-list --count HEAD)"
          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION"
          echo "BUILD_NUMBER=$BUILD_NUMBER"

      - name: Nuke cached build_configuration+ from Bazel output root
        run: |
          set -euo pipefail
          BAZEL_ROOT="/private/var/tmp/_bazel_containerhost"
          echo "Removing cached build_configuration+ repos from $BAZEL_ROOT..."
          find "$BAZEL_ROOT" -maxdepth 3 -type d -name "build_configuration+" -print -exec rm -rf {} + 2>/dev/null || true
          find "$BAZEL_ROOT" -maxdepth 3 -type d -name "build_configuration+*" -print -exec rm -rf {} + 2>/dev/null || true
          echo "Done."

      - name: Verify fake codesigning data
        run: |
          set -euo pipefail
          cd /Users/Shared/telegram-ios
          if [ ! -d "build-system/fake-codesigning" ]; then
            echo "ERROR: build-system/fake-codesigning not found."
            exit 1
          fi
          ls -la build-system/fake-codesigning

      - name: Import fake certificates
        run: |
          set -euo pipefail
          cd /Users/Shared/telegram-ios
          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs

      - name: Debug Make.py config source
        run: |
          set -euo pipefail
          cd /Users/Shared/telegram-ios

          echo "=== source tree profiles ==="
          ls -la build-system/fake-codesigning/profiles/ | head

          echo
          echo "=== existing build-input ==="
          ls -la build-input/ 2>/dev/null || echo "no build-input"

          echo
          echo "=== Make.py references to provisioning / fake-codesigning ==="
          grep -rn "provisioning\|fake-codesigning\|configuration-repository" \
            build-system/Make/*.py 2>/dev/null | head -50 || true

      - name: Build unsigned IPA
        run: |
          set -euo pipefail

          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd "$SOURCE_DIR"

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --bazel="$BAZEL_BIN" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath="build-system/fake-codesigning" \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          IPA_PATH=""
          if [ -f "bazel-bin/Telegram/Telegram.ipa" ]; then
            IPA_PATH="bazel-bin/Telegram/Telegram.ipa"
          else
            IPA_PATH=$(find bazel-out -path '*/bin/Telegram/Telegram.ipa' -type f -print -quit || true)
          fi

          if [ -z "$IPA_PATH" ] || [ ! -f "$IPA_PATH" ]; then
            echo "ERROR: Telegram.ipa was not produced."
            exit 1
          fi

          echo "Found IPA: $IPA_PATH"
          cp "$IPA_PATH" "$OUTPUT_PATH/Telegram.ipa"
          ls -lh "$OUTPUT_PATH/Telegram.ipa"

      - name: Strip signing and provisioning data
        run: |
          set -euo pipefail
          cd /Users/Shared/telegram-ios

          IPA="$PWD/build/artifacts/Telegram.ipa"
          TEMP_DIR="$(mktemp -d)"
          OUTPUT_DIR="$PWD/build/artifacts"
          trap 'rm -rf "$TEMP_DIR"' EXIT

          unzip -q "$IPA" -d "$TEMP_DIR"

          find "$TEMP_DIR/Payload" -type f -name "embedded.mobileprovision" -delete
          find "$TEMP_DIR/Payload" -type d -name "_CodeSignature" -prune -exec rm -rf {} +
          find "$TEMP_DIR/Payload" -type f -name "CodeResources" -delete

          rm -f "$IPA"
          cd "$TEMP_DIR"
          zip -qry "$OUTPUT_DIR/Telegram.ipa" Payload

          echo "Final unsigned IPA:"
          ls -lh "$OUTPUT_DIR/Telegram.ipa"

          if unzip -l "$OUTPUT_DIR/Telegram.ipa" | grep -q "embedded.mobileprovision"; then
            echo "::error::embedded.mobileprovision still present!"
            exit 1
          fi
          if unzip -l "$OUTPUT_DIR/Telegram.ipa" | grep -q "_CodeSignature/"; then
            echo "::error::_CodeSignature still present!"
            exit 1
          fi
          echo "IPA is ready for KSign."

      - name: Collect DSYMs
        run: |
          set -euo pipefail
          cd /Users/Shared/telegram-ios
          OUTPUT_PATH="build/artifacts"
          mkdir -p build/DSYMs

          if [ -d "bazel-bin/Telegram/Telegram.app.dSYM" ]; then
            cp -R bazel-bin/Telegram/*.dSYM build/DSYMs/ 2>/dev/null || true
          else
            find bazel-out -path '*/bin/Telegram/*.dSYM' -type d \
              -exec cp -R {} build/DSYMs/ \; 2>/dev/null || true
          fi

          rm -f "$OUTPUT_PATH/Telegram.DSYMs.zip"
          cd build
          zip -qr "../$OUTPUT_PATH/Telegram.DSYMs.zip" DSYMs
          cd ..
          ls -lh "$OUTPUT_PATH/Telegram.DSYMs.zip"

      - name: Upload IPA and DSYMs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}-unsigned
          path: |
            /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
          if-no-files-found: error

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: Telegram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }}) - KSign Ready
          body: |
            Unsigned Telegram iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }}).

            This IPA contains:
            - No provisioning profiles
            - No _CodeSignature directories
            - arm64 device binaries
            - DSYMs

            The IPA is intended to be signed separately with KSign.
          draft: false
          prerelease: false
          files: |
            /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}