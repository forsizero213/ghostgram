name: Fix profiles with Public.cer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Inject Public.cer into all profiles
        run: |
          set -euo pipefail

          PROF_DIR="build-system/fake-codesigning/profiles"
          CERT_DER="build-system/fake-codesigning/certs/Public.cer"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          # Fresh signer for CMS wrap.
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$WORK/key.pem" -out "$WORK/signer.pem" \
            -days 3650 -subj "/CN=Fake Provisioning" 2>/dev/null

          for f in "$PROF_DIR"/*.mobileprovision; do
            echo "=== $f"

            security cms -D -i "$f" > "$WORK/payload.plist"

            python3 - "$WORK/payload.plist" "$CERT_DER" <<'PY'
          import plistlib, sys
          plist_path, der_path = sys.argv[1], sys.argv[2]
          p = plistlib.load(open(plist_path, "rb"))
          p["DeveloperCertificates"] = [open(der_path, "rb").read()]
          plistlib.dump(p, open(plist_path, "wb"))
          print("  expiry =", p.get("ExpirationDate"))
          PY

            openssl smime -sign \
              -signer "$WORK/signer.pem" \
              -inkey  "$WORK/key.pem" \
              -certfile "$WORK/signer.pem" \
              -in "$WORK/payload.plist" \
              -outform der -nodetach \
              -out "$WORK/new.prof"

            openssl smime -verify -noverify -inform der -in "$WORK/new.prof" >/dev/null
            mv "$WORK/new.prof" "$f"
          done

      - name: Verify what we just wrote
        run: |
          set -euo pipefail
          PROF_DIR="build-system/fake-codesigning/profiles"
          PUB="build-system/fake-codesigning/certs/Public.cer"
          PUB_SHA="$(shasum -a 256 "$PUB" | awk '{print $1}')"
          echo "Public.cer sha256 = $PUB_SHA"
          echo

          for f in "$PROF_DIR"/*.mobileprovision; do
            echo "=== $f"
            TMP="$(mktemp -d)"
            python3 - "$f" "$TMP" <<'PY'
          import plistlib, subprocess, sys, os, hashlib
          raw = subprocess.check_output(["security", "cms", "-D", "-i", sys.argv[1]])
          p = plistlib.loads(raw)
          certs = p.get("DeveloperCertificates", [])
          print(f"  count={len(certs)}")
          for c in certs:
              print("  sha256:", hashlib.sha256(bytes(c)).hexdigest())
          PY
            rm -rf "$TMP"
          done

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build-system/fake-codesigning/profiles/
          git commit -m "Inject fake cert into all provisioning profiles" || echo "nothing to commit"
          git push

      - name: Verify after commit
        run: |
          set -euo pipefail
          git fetch origin
          git show HEAD:build-system/fake-codesigning/profiles/Intents.mobileprovision \
            > /tmp/intents.prof

          TMP="$(mktemp -d)"
          python3 - /tmp/intents.prof "$TMP" <<'PY'
          import plistlib, subprocess, sys, hashlib
          raw = subprocess.check_output(["security", "cms", "-D", "-i", sys.argv[1]])
          p = plistlib.loads(raw)
          certs = p.get("DeveloperCertificates", [])
          print(f"Intents.mobileprovision committed cert count = {len(certs)}")
          for c in certs:
              print("sha256:", hashlib.sha256(bytes(c)).hexdigest())
          PY
          rm -rf "$TMP"