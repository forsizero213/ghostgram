name: Fix BroadcastUpload provisioning profile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Show current state
        run: |
          set -euo pipefail
          PROF="build-system/fake-codesigning/profiles/BroadcastUpload.mobileprovision"
          echo "=== before ==="
          ls -la "$PROF"
          security cms -D -i "$PROF" | grep -A1 ExpirationDate

      - name: Patch profile
        run: |
          set -euo pipefail

          PROF="build-system/fake-codesigning/profiles/BroadcastUpload.mobileprovision"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$WORK/key.pem" -out "$WORK/cert.pem" \
            -days 3650 -subj "/CN=Fake Provisioning"

          security cms -D -i "$PROF" > "$WORK/payload.plist"

          /usr/libexec/PlistBuddy -c "Set :ExpirationDate 2035-12-31T23:59:59Z" "$WORK/payload.plist"

          openssl smime -sign \
            -signer "$WORK/cert.pem" \
            -inkey  "$WORK/key.pem" \
            -certfile "$WORK/cert.pem" \
            -in "$WORK/payload.plist" \
            -outform der -nodetach \
            -out "$WORK/new.prof"

          openssl smime -verify -noverify -inform der -in "$WORK/new.prof" >/dev/null

          mv "$WORK/new.prof" "$PROF"

      - name: Show new state
        run: |
          set -euo pipefail
          PROF="build-system/fake-codesigning/profiles/BroadcastUpload.mobileprovision"
          echo "=== after ==="
          ls -la "$PROF"
          security cms -D -i "$PROF" | grep -A1 ExpirationDate

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build-system/fake-codesigning/profiles/BroadcastUpload.mobileprovision
          git commit -m "Fix expired BroadcastUpload fake provisioning profile"
          git push
