name: Debug provisioning profiles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Check all provisioning profiles
        run: |
          set -euo pipefail
          PROF_DIR="build-system/fake-codesigning/profiles"
          echo "=== Directory listing ==="
          ls -la "$PROF_DIR"
          echo
          echo "=== Each profile ==="
          for f in "$PROF_DIR"/*.mobileprovision; do
            echo "----------------------------------------"
            echo "FILE: $f"
            echo "size: $(stat -f%z "$f") bytes"
            echo "type: $(file -b "$f")"
            echo "first 16 bytes:"
            head -c 16 "$f" | xxd
            echo "decoded:"
            security cms -D -i "$f" 2>&1 | grep -A1 -E "ExpirationDate|CreationDate|<key>Name</key>" || echo "  (cannot decode)"
          done

      - name: Check BroadcastUpload specifically
        run: |
          set -euo pipefail
          PROF="build-system/fake-codesigning/profiles/BroadcastUpload.mobileprovision"
          echo "=== file ==="
          ls -la "$PROF"
          file "$PROF"
          echo
          echo "=== full decoded plist ==="
          security cms -D -i "$PROF" 2>&1

      - name: Check git status of profiles
        run: |
          set -euo pipefail
          echo "=== git log for profiles dir ==="
          git log --oneline -5 -- build-system/fake-codesigning/profiles/ || true
          echo
          echo "=== git status ==="
          git status --porcelain build-system/fake-codesigning/ || true
          echo
          echo "=== last commit that touched BroadcastUpload ==="
          git log -1 --format=fuller -- build-system/fake-codesigning/profiles/BroadcastUpload.mobileprovision || true

      - name: Check current date
        run: |
          echo "UTC now: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "epoch:   $(date -u +%s)"

      - name: Where Bazel reads the profile from
        run: |
          set -euo pipefail
          echo "=== Telegram/BUILD around line 1439 ==="
          sed -n '1420,1460p' Telegram/BUILD || true
          echo
          echo "=== references to fake-codesigning in BUILD/bzl ==="
          grep -rn "fake-codesigning" --include=BUILD --include=*.bzl . 2>/dev/null | head -50 || true
          echo
          echo "=== references to BroadcastUpload.mobileprovision ==="
          grep -rn "BroadcastUpload.mobileprovision" --include=BUILD --include=*.bzl --include=*.py . 2>/dev/null | head -50 || true
