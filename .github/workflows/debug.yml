  diagnose:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          set -euo pipefail
          XCODE_VERSION=$(python3 -c '
          import json
          with open("versions.json") as f:
              print(json.load(f)["xcode"])
          ')
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      - name: Download Bazel
        run: |
          set -euo pipefail
          mkdir -p /tmp/bazel-bin-cache
          curl --retry 10 --retry-delay 5 -sSL \
            "https://github.com/bazelbuild/bazel/releases/download/8.4.2/bazel-8.4.2-darwin-arm64" \
            -o /tmp/bazel-bin-cache/bazel
          chmod +x /tmp/bazel-bin-cache/bazel
          echo "BAZEL_BIN=/tmp/bazel-bin-cache/bazel" >> "$GITHUB_ENV"

      - name: Fetch external repos
        run: |
          set -euo pipefail
          "$BAZEL_BIN" \
            --output_user_root=/private/var/tmp/_bazel_containerhost \
            fetch //Telegram:Telegram || true

      - name: Find the define name rules_apple uses
        run: |
          set -euo pipefail

          ROOT=/private/var/tmp/_bazel_containerhost
          echo "=== output_user_root contents ==="
          ls -la "$ROOT" || true

          RA_DIR=$(find "$ROOT" -maxdepth 3 -type d -name "rules_apple+" 2>/dev/null | head -1 || true)
          echo "rules_apple+ dir: $RA_DIR"

          if [ -z "$RA_DIR" ]; then
            echo "Could not find rules_apple+; dumping what IS there:"
            find "$ROOT" -maxdepth 3 -type d -name "*rules_apple*" 2>/dev/null | head
            find "$ROOT" -maxdepth 3 -type d -name "external" 2>/dev/null | head
            exit 0
          fi

          echo
          echo "=== grep ExpirationDate ==="
          grep -rn "ExpirationDate" "$RA_DIR" 2>/dev/null | head -50 || true

          echo
          echo "=== grep provisioning_profile_expiration ==="
          grep -rn "provisioning_profile_expiration" "$RA_DIR" 2>/dev/null | head -50 || true

          echo
          echo "=== grep apple.provisioning ==="
          grep -rn "apple\.provisioning" "$RA_DIR" 2>/dev/null | head -50 || true

          echo
          echo "=== grep config_setting around expiration ==="
          grep -rn -B2 -A6 "ExpirationDate" "$RA_DIR" 2>/dev/null | head -120 || true
