name: Debug + fix provisioning profiles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-fix-check:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      # ------------------------------------------------------------------
      # PHASE 1 — CHECK
      # ------------------------------------------------------------------
      - name: "PHASE 1 — Check all provisioning profiles"
        id: check1
        run: |
          set -euo pipefail

          PROF_DIR="build-system/fake-codesigning/profiles"
          echo "Profile dir: $PROF_DIR"
          ls -la "$PROF_DIR"

          NOW_EPOCH=$(date -u +%s)
          BROKEN=0

          echo
          echo "=== Decoding every .mobileprovision ==="
          for f in "$PROF_DIR"/*.mobileprovision; do
            echo "----------------------------------------"
            echo "FILE: $f"
            echo "size: $(stat -f%z "$f") bytes"
            echo "type: $(file -b "$f")"
            echo "first 16 bytes:"
            head -c 16 "$f" | xxd

            DECODED="$(security cms -D -i "$f" 2>/dev/null || true)"
            if [ -z "$DECODED" ]; then
              echo "  STATUS: CORRUPT (cannot decode as CMS)"
              BROKEN=1
              continue
            fi

            EXP="$(printf '%s' "$DECODED" | grep -A1 '<key>ExpirationDate</key>' | grep '<date>' | sed -E 's/.*<date>(.*)<\/date>.*/\1/' || true)"
            NAME="$(printf '%s' "$DECODED" | grep -A1 '<key>Name</key>' | grep '<string>' | sed -E 's/.*<string>(.*)<\/string>.*/\1/' || true)"

            echo "  Name:           $NAME"
            echo "  ExpirationDate: $EXP"

            if [ -z "$EXP" ]; then
              echo "  STATUS: NO EXPIRY DATE"
              BROKEN=1
              continue
            fi

            EXP_EPOCH=$(date -j -u -f "%Y-%m-%dT%H:%M:%SZ" "$EXP" +%s 2>/dev/null || echo 0)
            if [ "$EXP_EPOCH" -le "$NOW_EPOCH" ]; then
              echo "  STATUS: EXPIRED (now is $(date -u +%Y-%m-%dT%H:%M:%SZ))"
              BROKEN=1
            else
              echo "  STATUS: OK"
            fi
          done

          echo
          echo "BROKEN=$BROKEN"
          echo "broken=$BROKEN" >> "$GITHUB_OUTPUT"

      - name: "PHASE 1 — Summary"
        run: |
          if [ "${{ steps.check1.outputs.broken }}" = "1" ]; then
            echo "::warning::Some provisioning profiles are broken or expired."
          else
            echo "::notice::All provisioning profiles are valid."
          fi

      # ------------------------------------------------------------------
      # PHASE 2 — FIX (only runs if phase 1 found problems)
      # ------------------------------------------------------------------
      - name: "PHASE 2 — Fix broken profiles"
        if: steps.check1.outputs.broken == '1'
        run: |
          set -euo pipefail

          PROF_DIR="build-system/fake-codesigning/profiles"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          # Self-signed cert/key to wrap plists as CMS.
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$WORK/key.pem" -out "$WORK/cert.pem" \
            -days 3650 -subj "/CN=Fake Provisioning" 2>/dev/null

          FUTURE_DATE="2035-12-31T23:59:59Z"
          NOW_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          NOW_EPOCH=$(date -u +%s)

          for f in "$PROF_DIR"/*.mobileprovision; do
            echo "========================================"
            echo "Evaluating: $f"

            DECODED="$(security cms -D -i "$f" 2>/dev/null || true)"

            if [ -n "$DECODED" ]; then
              # Decodable — check whether it actually needs fixing.
              EXP="$(printf '%s' "$DECODED" | grep -A1 '<key>ExpirationDate</key>' | grep '<date>' | sed -E 's/.*<date>(.*)<\/date>.*/\1/' || true)"
              EXP_EPOCH=$(date -j -u -f "%Y-%m-%dT%H:%M:%SZ" "${EXP:-1970-01-01T00:00:00Z}" +%s 2>/dev/null || echo 0)

              if [ -n "$EXP" ] && [ "$EXP_EPOCH" -gt "$NOW_EPOCH" ]; then
                echo "  Still valid (expires $EXP). Skipping."
                continue
              fi

              echo "  Needs fixing (expiry: ${EXP:-none})."

              printf '%s' "$DECODED" > "$WORK/payload.plist"

              /usr/libexec/PlistBuddy -c "Set :ExpirationDate $FUTURE_DATE" "$WORK/payload.plist" \
                || /usr/libexec/PlistBuddy -c "Add :ExpirationDate date $FUTURE_DATE" "$WORK/payload.plist"

              /usr/libexec/PlistBuddy -c "Set :CreationDate $NOW_DATE" "$WORK/payload.plist" 2>/dev/null \
                || /usr/libexec/PlistBuddy -c "Add :CreationDate date $NOW_DATE" "$WORK/payload.plist" 2>/dev/null \
                || true
            else
              # Not decodable — rebuild from scratch, keeping just the filename
              # as a hint for the profile name.
              echo "  Undecodable. Rebuilding from scratch."

              BASE="$(basename "$f" .mobileprovision)"
              cat > "$WORK/payload.plist" <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>Name</key>
  <string>fake-${BASE}</string>
  <key>UUID</key>
  <string>$(uuidgen)</string>
  <key>TeamIdentifier</key>
  <array><string>C67CF9S4VU</string></array>
  <key>CreationDate</key>
  <date>${NOW_DATE}</date>
  <key>ExpirationDate</key>
  <date>${FUTURE_DATE}</date>
  <key>Entitlements</key>
  <dict>
    <key>application-identifier</key>
    <string>C67CF9S4VU.ph.telegra.Telegraph</string>
    <key>com.apple.developer.team-identifier</key>
    <string>C67CF9S4VU</string>
    <key>get-task-allow</key>
    <false/>
  </dict>
</dict>
</plist>
EOF
            fi

            # Sign to a temp blob.
            openssl smime -sign \
              -signer "$WORK/cert.pem" \
              -inkey  "$WORK/key.pem" \
              -certfile "$WORK/cert.pem" \
              -in "$WORK/payload.plist" \
              -outform der -nodetach \
              -out "$WORK/new.prof"

            # Verify before replacing.
            openssl smime -verify -noverify -inform der -in "$WORK/new.prof" >/dev/null
            security cms -D -i "$WORK/new.prof" >/dev/null

            mv "$WORK/new.prof" "$f"
            echo "  Replaced."
          done

      # ------------------------------------------------------------------
      # PHASE 3 — CHECK AGAIN
      # ------------------------------------------------------------------
      - name: "PHASE 3 — Re-check all provisioning profiles"
        id: check2
        run: |
          set -euo pipefail

          PROF_DIR="build-system/fake-codesigning/profiles"
          NOW_EPOCH=$(date -u +%s)
          BROKEN=0

          for f in "$PROF_DIR"/*.mobileprovision; do
            echo "----------------------------------------"
            echo "FILE: $f"
            DECODED="$(security cms -D -i "$f" 2>/dev/null || true)"
            if [ -z "$DECODED" ]; then
              echo "  STATUS: STILL CORRUPT"
              BROKEN=1
              continue
            fi

            EXP="$(printf '%s' "$DECODED" | grep -A1 '<key>ExpirationDate</key>' | grep '<date>' | sed -E 's/.*<date>(.*)<\/date>.*/\1/' || true)"
            EXP_EPOCH=$(date -j -u -f "%Y-%m-%dT%H:%M:%SZ" "${EXP:-1970-01-01T00:00:00Z}" +%s 2>/dev/null || echo 0)

            if [ "$EXP_EPOCH" -le "$NOW_EPOCH" ]; then
              echo "  STATUS: STILL EXPIRED ($EXP)"
              BROKEN=1
            else
              echo "  STATUS: OK ($EXP)"
            fi
          done

          echo "broken=$BROKEN" >> "$GITHUB_OUTPUT"

      - name: "PHASE 3 — Verdict"
        run: |
          if [ "${{ steps.check2.outputs.broken }}" = "1" ]; then
            echo "::error::After fixing, some profiles are still broken. See Phase 3 logs."
            exit 1
          fi
          echo "::notice::All provisioning profiles are valid after fix."
          echo
          echo "To bake the fix into the repo, download the patched files and commit them."
          echo "See the 'Upload patched profiles' artifact below."

      # ------------------------------------------------------------------
      # Publish the fixed profiles so you can commit them into the repo.
      # ------------------------------------------------------------------
      - name: Upload patched profiles
        if: steps.check1.outputs.broken == '1' && steps.check2.outputs.broken == '0'
        uses: actions/upload-artifact@v4
        with:
          name: patched-provisioning-profiles
          path: build-system/fake-codesigning/profiles/*.mobileprovision
          if-no-files-found: error
