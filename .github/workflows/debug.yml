name: Inject fake cert into all profiles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Inject cert into every profile
        run: |
          set -euo pipefail

          PROF_DIR="build-system/fake-codesigning/profiles"
          CERT_DER="build-system/fake-codesigning/certs/Public.cer"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          # Self-signed cert used only to wrap the plist as CMS.
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$WORK/key.pem" -out "$WORK/signer.pem" \
            -days 3650 -subj "/CN=Fake Provisioning" 2>/dev/null

          for f in "$PROF_DIR"/*.mobileprovision; do
            echo "=== $f"
            security cms -D -i "$f" > "$WORK/payload.plist"

            python3 - "$WORK/payload.plist" "$CERT_DER" <<'PY'
          import plistlib, sys
          p = plistlib.load(open(sys.argv[1], "rb"))
          p["DeveloperCertificates"] = [open(sys.argv[2], "rb").read()]
          plistlib.dump(p, open(sys.argv[1], "wb"))
          print("  expiry:", p.get("ExpirationDate"), "| certs:", len(p["DeveloperCertificates"]))
          PY

            openssl smime -sign \
              -signer "$WORK/signer.pem" \
              -inkey  "$WORK/key.pem" \
              -certfile "$WORK/signer.pem" \
              -in "$WORK/payload.plist" \
              -outform der -nodetach \
              -out "$WORK/new.prof"

            openssl smime -verify -noverify -inform der -in "$WORK/new.prof" >/dev/null
            DECODED="$(security cms -D -i "$WORK/new.prof")"
            echo "$DECODED" | grep -q "DeveloperCertificates" || { echo "::error::missing DeveloperCertificates"; exit 1; }
            echo "$DECODED" | grep -q "<date>" || { echo "::error::missing date"; exit 1; }

            mv "$WORK/new.prof" "$f"
          done

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build-system/fake-codesigning/profiles/
          git commit -m "Inject fake cert into all provisioning profiles"
          git push