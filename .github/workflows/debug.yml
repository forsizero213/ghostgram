name: Strip DeveloperCertificates from fake profiles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Fix all profiles
        run: |
          set -euo pipefail
          PROF_DIR="build-system/fake-codesigning/profiles"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$WORK/key.pem" -out "$WORK/cert.pem" \
            -days 3650 -subj "/CN=Fake Provisioning" 2>/dev/null

          for f in "$PROF_DIR"/*.mobileprovision; do
            echo "=== $f"
            security cms -D -i "$f" > "$WORK/payload.plist"

            python3 - "$WORK/payload.plist" <<'PY'
          import plistlib, sys
          p = plistlib.load(open(sys.argv[1], "rb"))
          p.pop("DeveloperCertificates", None)
          plistlib.dump(p, open(sys.argv[1], "wb"))
          PY

            openssl smime -sign \
              -signer "$WORK/cert.pem" \
              -inkey  "$WORK/key.pem" \
              -certfile "$WORK/cert.pem" \
              -in "$WORK/payload.plist" \
              -outform der -nodetach \
              -out "$WORK/new.prof"

            openssl smime -verify -noverify -inform der -in "$WORK/new.prof" >/dev/null
            mv "$WORK/new.prof" "$f"
          done

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build-system/fake-codesigning/profiles/
          git commit -m "Strip DeveloperCertificates from fake provisioning profiles"
          git push