name: Debug Make.py Help

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          set -euo pipefail
          XCODE_VERSION=$(python3 -c '
          import json
          with open("versions.json") as f:
              print(json.load(f)["xcode"])
          ')
          echo "Using Xcode $XCODE_VERSION"
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      - name: Show Make.py build help
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 build-system/Make/Make.py build --help 2>&1

      - name: Show Make.py help (general)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 build-system/Make/Make.py --help 2>&1

      - name: Inspect Make.py source for codesigning flags
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          echo "=== Grep for disable/skip/signing keywords ==="
          grep -in "disable\|skip\|sign" build-system/Make/Make.py | head -50 || echo "No matches"

      - name: Check appstore-configuration.json structure
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [ -f "build-system/appstore-configuration.json" ]; then
            echo "=== Found existing config ==="
            cat build-system/appstore-configuration.json | python3 -m json.tool
          else
            echo "No config file yet"
          fi

      - name: List Build environment files
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          echo "=== Build system structure ==="
          find build-system/Make -type f -name "*.py" | head -20
          echo ""
          echo "=== Build system argument parsing ==="
          grep -n "argparse\|add_argument" build-system/Make/Make.py | head -30 || true
