name: Diagnose Build Environment

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      repo_root:
        description: "Path to telegram-ios checkout inside the runner"
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  diagnose:
    name: Run diagnostics
    runs-on: macos-14
    timeout-minutes: 30

    env:
      REPO_ROOT: ${{ github.event.inputs.repo_root || github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Runner info
        shell: bash
        run: |
          sw_vers
          uname -m
          xcodebuild -version || true
          xcode-select -p || true
          echo "REPO_ROOT=$REPO_ROOT"

      # ---------------------------------------------------------------------
      # Everything below is the "diagnostic" — inlined, no external files.
      # ---------------------------------------------------------------------
      - name: Set up diagnostic helpers
        shell: bash
        run: |
          set -e
          mkdir -p .diag
          cat > .diag/lib.sh <<'LIB'
          PASS=0; WARN=0; FAIL=0
          hdr() { printf "\n== %s ==\n" "$1"; }
          record() {
            case "$1" in
              critical) FAIL=$((FAIL+1)); printf "  FAIL  %s\n" "$2" ;;
              warn)     WARN=$((WARN+1)); printf "  WARN  %s\n" "$2" ;;
              *)        PASS=$((PASS+1)); printf "  OK    %s\n" "$2" ;;
            esac
          }
          check() {
            local id="$1" desc="$2" sev="$3" cmd="$4" out rc
            hdr "$id"; printf "  %s\n" "$desc"; printf "  \$ %s\n" "$cmd"
            out="$(bash -c "$cmd" 2>&1)"; rc=$?
            [ -n "$out" ] && printf "%s\n" "$out" | sed 's/^/    /'
            if   [ $rc -ne 0 ]; then record "$sev" "command exited $rc"
            elif [ -z "$out" ]; then record "$sev" "no output"
            else record "$sev" "ok"; fi
          }
          LIB
          echo "helpers written"

      - name: Run diagnostics (capture)
        id: diag
        shell: bash
        run: |
          set +e
          . .diag/lib.sh

          PROV="$REPO_ROOT/external/build_configuration+/provisioning"
          CERTS="$REPO_ROOT/build-system/fake-codesigning/certs"
          BAZELOUT="/private/var/tmp/_bazel_containerhost"
          WIDGET="$PROV/Widget.mobileprovision"

          # -- 1. system --
          check macos_version        "macOS version and build"                info     "sw_vers"
          check xcode_version        "Active Xcode version"                   warn     "xcodebuild -version || true"
          check xcode_select         "Active developer dir"                   warn     "xcode-select -p || true"
          check arch                 "Host architecture"                      warn     "uname -m"

          # -- 2. keychain / identities --
          check signing_identities   "Valid codesigning identities (default)" critical "security find-identity -v -p codesigning"
          check default_keychain     "Default keychain"                       warn     "security default-keychain"
          check keychain_list        "User keychain search list"              warn     "security list-keychains -d user"
          check keychain_unlocked    "Login keychain unlocked"                critical "security show-keychain-info ~/Library/Keychains/login.keychain-db"
          check apple_dev_certs      "Apple Development certs present"        critical "security find-certificate -a -c 'Apple Development' -Z 2>/dev/null | head -40 || true"
          check apple_dist_certs     "Apple Distribution certs present"       warn     "security find-certificate -a -c 'Apple Distribution' -Z 2>/dev/null | head -40 || true"
          check wwdr_intermediates   "Apple WWDR intermediates present"       critical "security find-certificate -a -c 'Apple Worldwide Developer Relations' -Z 2>/dev/null | head -40 || true"

          # -- 3. profiles --
          check widget_profile_exists "Widget.mobileprovision exists"        critical "test -f '$WIDGET' && echo OK || echo MISSING"
          check widget_profile_team   "TeamIdentifier in Widget profile"     critical "security cms -D -i '$WIDGET' 2>/dev/null | plutil -extract TeamIdentifier.0 raw - 2>/dev/null || echo '<unreadable>'"
          check widget_profile_name   "Name of Widget profile"               info     "security cms -D -i '$WIDGET' 2>/dev/null | plutil -extract Name raw - 2>/dev/null || echo '<unreadable>'"
          check widget_profile_uuid   "UUID of Widget profile"               info     "security cms -D -i '$WIDGET' 2>/dev/null | plutil -extract UUID raw - 2>/dev/null || echo '<unreadable>'"
          check widget_profile_expiry "ExpirationDate of Widget profile"     critical "security cms -D -i '$WIDGET' 2>/dev/null | plutil -extract ExpirationDate raw - 2>/dev/null || echo '<unreadable>'"
          check all_shipped_profiles  "All shipped provisioning profiles"    info     "ls -la '$PROV' 2>&1 || echo 'dir not found'"

          # -- 4. fake certs --
          check fake_certs_dir       "Fake codesigning certs dir"            warn     "ls -la '$CERTS' 2>&1 || echo 'dir not found'"
          check fake_public_cer      "Public.cer present"                    warn     "test -f '$CERTS/Public.cer' && echo OK || echo MISSING"
          check fake_public_cer_info "Public.cer subject/issuer/dates"       info     "openssl x509 -inform DER -in '$CERTS/Public.cer' -noout -subject -issuer -dates 2>/dev/null || openssl x509 -in '$CERTS/Public.cer' -noout -subject -issuer -dates 2>/dev/null || echo '<unreadable>'"
          check fake_public_cer_sha  "Public.cer SHA1"                       info     "openssl x509 -inform DER -in '$CERTS/Public.cer' -noout -fingerprint -sha1 2>/dev/null || openssl x509 -in '$CERTS/Public.cer' -noout -fingerprint -sha1 2>/dev/null || echo '<unreadable>'"

          # -- 5. build config --
          check build_config_dir     "external/build_configuration+ listing" info     "ls -la '$REPO_ROOT/external/build_configuration+/' 2>&1 || echo 'dir not found'"
          check team_id_in_config    "DEVELOPMENT_TEAM/TEAM_ID/CODE_SIGN_IDENTITY" info "grep -RInE 'DEVELOPMENT_TEAM|TEAM_ID|CODE_SIGN_IDENTITY' '$REPO_ROOT/external/build_configuration+/' 2>/dev/null | head -20 || echo '<none>'"
          check bazel_binary         "Bazel wrapper present"                 warn     "ls -la '$REPO_ROOT/build-input/bazel-8.4.2-darwin-arm64' 2>&1 || echo 'not present'"
          check bazel_cache_dir      "Bazel output_user_root"                info     "ls -la '$BAZELOUT/' 2>&1 || echo 'not present'"
          check stale_processes      "Stale bazel/process-and-sign procs"    warn     "pgrep -fl 'bazel|process-and-sign' 2>/dev/null || echo none"
          check widget_target        "WidgetExtension in Telegram/BUILD"     info     "grep -n 'WidgetExtension' '$REPO_ROOT/Telegram/BUILD' 2>/dev/null | head -20 || echo '<BUILD not found>'"
          check sign_scripts         "process-and-sign scripts"              info     "find '$BAZELOUT' -name 'process-and-sign--*.sh' 2>/dev/null | head -5 || echo '<none>'"
          check last_build_log       "Tail of bazel command.log"             info     "find '$BAZELOUT' -name 'command.log' -exec tail -n 40 {} \\; 2>/dev/null | tail -40 || echo '<none>'"

          # -- 6. identity ⇄ profile cross-check --
          hdr "identity_match_check"
          echo "  Cross-check: is any system identity SHA1 inside Widget.mobileprovision?"
          if [ ! -f "$WIDGET" ]; then
            record critical "profile not found: $WIDGET"
          else
            SYS_IDS="$(security find-identity -v -p codesigning 2>/dev/null | awk -F'[()]' '/\)/{print $1}' | awk '{print toupper($2)}' | sort -u)"
            if [ -z "$SYS_IDS" ]; then
              echo "    (no system codesigning identities)"
            else
              echo "    system identities:"; printf "%s\n" "$SYS_IDS" | sed 's/^/      /'
            fi

            PROF_IDS="$(security cms -D -i "$WIDGET" 2>/dev/null \
              | plutil -extract DeveloperCertificates xml1 -o - - 2>/dev/null \
              | python3 -c '
import sys, plistlib, subprocess, tempfile, pathlib
try:
    data = plistlib.loads(sys.stdin.buffer.read())
except Exception:
    sys.exit(0)
with tempfile.TemporaryDirectory() as td:
    for cert in data:
        p = pathlib.Path(td)/"c.der"; p.write_bytes(cert)
        try:
            out = subprocess.check_output(
                ["openssl","x509","-inform","DER","-in",str(p),
                 "-noout","-fingerprint","-sha1"],
                stderr=subprocess.DEVNULL).decode()
            print(out.split("=")[1].strip().replace(":","").upper())
        except Exception:
            pass
' 2>/dev/null)"

            if [ -z "$PROF_IDS" ]; then
              echo "    (no certs decoded from profile)"
              record critical "could not decode DeveloperCertificates from profile"
            else
              echo "    profile certs:"; printf "%s\n" "$PROF_IDS" | sed 's/^/      /'
              MATCH=0
              while read -r pid; do
                [ -z "$pid" ] && continue
                if echo "$SYS_IDS" | grep -qx "$pid"; then
                  echo "    MATCH    $pid"; MATCH=1
                else
                  echo "    NO MATCH $pid"
                fi
              done <<< "$PROF_IDS"
              if [ $MATCH -eq 1 ]; then
                record info "at least one identity matches the profile"
              else
                record critical "no system identity matches the profile — signing will fail"
              fi
            fi
          fi

          hdr "summary"
          echo "  PASS: $PASS"
          echo "  WARN: $WARN"
          echo "  FAIL: $FAIL"
          if [ $FAIL -gt 0 ]; then
            echo "  RESULT: critical issues found"
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          else
            echo "  RESULT: no critical issues"
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Build summary
        id: summary
        shell: bash
        run: |
          set +e
          PROV="$REPO_ROOT/external/build_configuration+/provisioning"
          WIDGET="$PROV/Widget.mobileprovision"
          {
            echo "## Diagnostic summary"
            echo ""
            echo "- Repo:   \`${{ github.repository }}\`"
            echo "- Ref:    \`${{ github.ref }}\`"
            echo "- SHA:    \`${{ github.sha }}\`"
            echo "- Runner: \`$(uname -m)\` / \`$(sw_vers -productVersion)\`"
            echo "- Xcode:  \`$(xcodebuild -version 2>/dev/null | head -1)\`"
            echo "- Diagnostic exit: \`${{ steps.diag.outputs.exit_code }}\`"
            echo ""
            echo "### Signing identities"
            echo '```'
            security find-identity -v -p codesigning 2>&1 || echo "(none)"
            echo '```'
            echo ""
            echo "### Keychain search list"
            echo '```'
            security list-keychains -d user 2>&1 || true
            echo '```'
            echo ""
            echo "### Shipped provisioning profiles"
            echo '```'
            ls -la "$PROV" 2>&1 || echo "(dir not found)"
            echo '```'
            echo ""
            echo "### Widget.mobileprovision"
            if [ -f "$WIDGET" ]; then
              echo '```'
              echo "TeamIdentifier: $(security cms -D -i "$WIDGET" 2>/dev/null | plutil -extract TeamIdentifier.0 raw - 2>/dev/null || echo '<unreadable>')"
              echo "UUID:           $(security cms -D -i "$WIDGET" 2>/dev/null | plutil -extract UUID raw - 2>/dev/null || echo '<unreadable>')"
              echo "ExpirationDate: $(security cms -D -i "$WIDGET" 2>/dev/null | plutil -extract ExpirationDate raw - 2>/dev/null || echo '<unreadable>')"
              echo '```'
            else
              echo "_Widget.mobileprovision not present._"
            fi
            echo ""
            echo "_Full log attached as \`diagnostic.log\` artifact._"
          } > summary.md
          echo "path=summary.md" >> "$GITHUB_OUTPUT"
          cat summary.md

      - name: Write job summary
        run: cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-${{ github.run_id }}
          path: |
            summary.md
          retention-days: 14
          if-no-files-found: warn

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: diagnostic
          path: summary.md

      - name: Gate (soft)
        if: steps.diag.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "::warning::Diagnostic reported critical issues (exit ${{ steps.diag.outputs.exit_code }})."
          # Uncomment to hard-fail CI:
          # exit 1